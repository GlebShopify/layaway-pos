# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d396f14e1219920230591a3954f821f3"
name = "layaway-pos"
application_url = "https://ebooks-statistics-janet-latex.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/edited", "orders/paid", "order_transactions/create" ]
  uri = "/webhooks"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_orders,read_all_orders,write_orders,read_customers,write_merchant_managed_fulfillment_orders,write_cart_transforms,write_order_edits"

[auth]
redirect_urls = [ "https://ebooks-statistics-janet-latex.trycloudflare.com/api/auth/callback" ]

[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read FAQ entries stored in the app"
